<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map</title>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
  <!-- YOUR_CLIENT_ID 를 네이버 클라우드 플랫폼에서 받은 Client ID로 바꾸세요 -->
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=lcz1qx02dx"></script>
</head>
<body>
  <div id="map"></div>

  <script>
    // 지도 중심 좌표 (예: 서울시청)
    var center = new naver.maps.LatLng(37.8866, 127.7385);

    var map = new naver.maps.Map('map', {
      center: center,
      zoom: 15,
      zoomControl: true
    });

    // 마커 표시
    var marker = new naver.maps.Marker({
      position: center,
      map: map
    });

  </script>
</body>
</html>
