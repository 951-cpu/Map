<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100%; }

    /* 왼쪽 위 패널 */
    #panel {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      width: 340px; max-width: calc(100% - 24px); box-sizing: border-box;
      background: #fff; border-radius: 10px; padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    #search {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
    }
    #search:focus { outline: none; border-color: #03c75a; }

    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .row:empty { display: none; }
    .btn {
      border: 1px solid #ccc; background: #fff; border-radius: 16px;
      padding: 5px 11px; font-size: 13px; cursor: pointer;
    }
    .btn.l0.active { background: #03c75a; border-color: #03c75a; color: #fff; }
    .btn.l1.active { background: #333;    border-color: #333;    color: #fff; }
    .btn.l2.active { background: #777;    border-color: #777;    color: #fff; }

    #countBar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    #count { font-size: 12px; color: #666; }
    #toggle { border: none; background: none; color: #03c75a; font-size: 12px; cursor: pointer; padding: 0; }
    #panel.collapsed #list { display: none; }

    #list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 40vh; overflow-y: auto; }
    #list:empty { display: none; }
    #list li { padding: 8px 4px; border-top: 1px solid #eee; cursor: pointer; font-size: 13px; }
    #list li:hover { background: #f5f5f5; }
    #list .name { font-weight: bold; }
    #list .meta { color: #888; font-size: 12px; margin-top: 2px; }
    #list .nopos { color: #d33; }
  </style>
  <!-- submodules=geocoder : 주소를 좌표로 바꾸는 기능 -->
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=lcz1qx02dx&submodules=geocoder"></script>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <input id="search" type="search" placeholder="가게 이름, 주소, 메뉴 검색">
    <div class="row" id="row0"></div>
    <div class="row" id="row1"></div>
    <div class="row" id="row2"></div>
    <div id="countBar">
      <span id="count">위치 불러오는 중…</span>
      <button id="toggle">목록 접기 ▲</button>
    </div>
    <ul id="list"></ul>
  </div>

  <script>
    // ===== 1. 카테고리 설정 =====
    // 큰 카테고리 → 중간 카테고리 → 세부 카테고리
    // 세부가 없으면 [] 로 둡니다. 큰 카테고리는 여기에 추가하면 버튼이 자동으로 생깁니다.
    var CATEGORIES = {
      '무한리필': {
        '해산물': [],
        '육류': ['돼지고기', '소고기', '샤브샤브', '양꼬치·훠궈']
      },
      '6,000원 이하': {}   // 중간 카테고리가 없으면 {} 로 둡니다
      // '카페': { '디저트': [], '스터디': [] },
    };

    // ===== 2. 가게 목록 =====
    // cats: '중간' 또는 '중간/세부'. 여러 개 넣으면 어느 필터에서든 보입니다.
    // lat, lng 를 직접 넣으면 주소 검색 대신 그 좌표를 씁니다.
    var ADDR_PREFIX = '강원특별자치도 춘천시 ';
    var PLACES = [
      { name: '우리송어양식장횟집',   addr: '우묵길60번길 26',     main: '무한리필', cats: ['해산물'] },
      { name: '송암골평창송어 춘천점', addr: '공지로 345',           main: '무한리필', cats: ['해산물'] },
      { name: '장어왔소',             addr: '동면 만천로 82',       main: '무한리필', cats: ['해산물'] },
      { name: '춘천조개창고',         addr: '동면 금촌로 388',      main: '무한리필', cats: ['해산물'] },
      { name: '명현만간장게장 춘천점', addr: '춘천로 180',           main: '무한리필', cats: ['해산물'] },

      { name: '화로상회',             addr: '우묵길52번길 10',     main: '무한리필', cats: ['육류/돼지고기'] },
      { name: '한별관',               addr: '우묵길78번길 26',     main: '무한리필', cats: ['육류/돼지고기'] },
      { name: '청춘화로',             addr: '스무숲4길 9',          main: '무한리필', cats: ['육류/돼지고기'] },
      { name: '929어소오소 강대점',    addr: '백령로 142',           main: '무한리필', cats: ['육류/돼지고기'] },
      { name: '고기싸롱',             addr: '춘천로 324',           main: '무한리필', cats: ['육류/돼지고기'] },
      { name: '꿀돼지',               addr: '삭주로80번길 6',       main: '무한리필', cats: ['육류/돼지고기'] },
      { name: '육당',                 addr: '백령로 148-1',         main: '무한리필', cats: ['육류/돼지고기'] },
      { name: '엉터리무한대패',        addr: '백령로 144',           main: '무한리필', cats: ['육류/돼지고기'] },
      { name: '춘천꽃대패',           addr: '우묵들길 28',        main: '무한리필', cats: ['해산물', '육류/돼지고기', '육류/소고기'], note: '돼지, 소, 생연어' },

      { name: '육회왕자연어공주',      addr: '애막골길7번길 28',     main: '무한리필', cats: ['육류/소고기'], note: '육회, 참치' },

      { name: '편편집 춘천삼천점',     addr: '스포츠타운길 432',     main: '무한리필', cats: ['육류/샤브샤브'] },
      { name: '일공공샤브 춘천점',     addr: '후석로 120',           main: '무한리필', cats: ['육류/샤브샤브'] },
      { name: '샤브르정원 춘천점',     addr: '보안길 58',            main: '무한리필', cats: ['육류/샤브샤브'] },
      { name: '샤브올데이 춘천점',     addr: '춘천로 12',            main: '무한리필', cats: ['육류/샤브샤브'] },

      { name: '초원가 후평점',         addr: '보안길 71',            main: '무한리필', cats: ['육류/양꼬치·훠궈'] },
      { name: '재왕무한리필양꼬치훠궈', addr: '후석로186번길 10-1',   main: '무한리필', cats: ['육류/양꼬치·훠궈'] },
      { name: '춘천 일품양 무한리필',   addr: '스무숲1길 4-8',        main: '무한리필', cats: ['육류/양꼬치·훠궈'], note: '양꼬치' },
      { name: '춘천일품양숯불양갈비양꼬치무한리필', addr: '영서로 2763', main: '무한리필', cats: ['육류/양꼬치·훠궈'], note: '양꼬치' },

      { name: '크루아 라다',           addr: '서부대성로44번길 25',  main: '무한리필', cats: ['육류/돼지고기'], note: '무까타' },

      // ----- 6,000원 이하 -----
      // detail: 층·상가 정보 (지도 위치 검색에는 쓰지 않고 화면에만 표시)
      { name: '하마집',               addr: '후석로369번길 2',      main: '6,000원 이하', cats: [] },
      { name: '쥐눈이콩나물밥 1호점',  addr: '중앙로 33',            main: '6,000원 이하', cats: [], detail: '지하상가' },
      { name: '신촌돈까스',           addr: '서부대성로227번길 24', main: '6,000원 이하', cats: [], detail: '1층' },
      { name: '봉실스넥',             addr: '서부대성로239번길 8',  main: '6,000원 이하', cats: [] },
      { name: '광치해장국',           addr: '소양로 108',           main: '6,000원 이하', cats: [] },
      { name: '오믈하우스',           addr: '서부대성로227번길 24', main: '6,000원 이하', cats: [], detail: '2층' }
    ];

    // ===== 3. 지도 =====
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(37.8866, 127.7385), // 한림대학교
      zoom: 14,
      zoomControl: true
    });
    var infoWindow = new naver.maps.InfoWindow({ content: '' });

    function catLabel(p) {
      if (!p.cats.length) return p.main;
      return p.main + ' · ' + p.cats.map(function (c) { return c.replace('/', ' > '); }).join(', ');
    }

    function fullAddr(p) {
      return p.addr + (p.detail ? ' ' + p.detail : '');
    }

    function openInfo(p) {
      var link = 'https://map.naver.com/p/search/' + encodeURIComponent('춘천 ' + p.name);
      infoWindow.setContent(
        '<div style="padding:10px 12px;font-size:13px;line-height:1.5;max-width:240px;">' +
          '<b>' + p.name + '</b><br>' +
          '<span style="color:#888">' + catLabel(p) + '</span><br>' +
          (p.note ? p.note + '<br>' : '') +
          '춘천시 ' + fullAddr(p) + '<br>' +
          '<a href="' + link + '" target="_blank">네이버 지도에서 보기</a>' +
        '</div>'
      );
      infoWindow.open(map, p.marker);
    }

    // 주소 → 좌표
    function geocode(p) {
      return new Promise(function (resolve) {
        if (p.lat && p.lng) return resolve();
        naver.maps.Service.geocode({ query: ADDR_PREFIX + p.addr }, function (status, res) {
          if (status === naver.maps.Service.Status.OK && res.v2.addresses.length) {
            p.lat = parseFloat(res.v2.addresses[0].y);
            p.lng = parseFloat(res.v2.addresses[0].x);
          } else {
            console.warn('주소 검색 실패', status, p.name, ADDR_PREFIX + p.addr);
          }
          resolve();
        });
      });
    }

    // ===== 4. 필터 + 검색 =====
    var sel = ['전체', '전체', '전체']; // [큰, 중간, 세부]
    var query = '';

    function matchCategory(p) {
      if (sel[0] !== '전체' && p.main !== sel[0]) return false;
      if (!p.cats.length) return sel[1] === '전체';
      return p.cats.some(function (c) {
        var parts = c.split('/');
        if (sel[1] !== '전체' && parts[0] !== sel[1]) return false;
        if (sel[2] !== '전체' && parts[1] !== sel[2]) return false;
        return true;
      });
    }

    function matchSearch(p) {
      if (!query) return true;
      var text = (p.name + ' ' + fullAddr(p) + ' ' + p.main + ' ' + (p.note || '') + ' ' + p.cats.join(' ')).toLowerCase();
      return text.indexOf(query) !== -1;
    }

    function buttonRow(id, level, items) {
      var row = document.getElementById(id);
      row.innerHTML = '';
      if (!items) return;
      ['전체'].concat(items).forEach(function (label) {
        var b = document.createElement('button');
        b.className = 'btn l' + level + (sel[level] === label ? ' active' : '');
        b.textContent = label;
        b.onclick = function () {
          sel[level] = label;
          for (var i = level + 1; i < sel.length; i++) sel[i] = '전체';
          render();
        };
        row.appendChild(b);
      });
    }

    function render() {
      // 버튼 줄
      buttonRow('row0', 0, Object.keys(CATEGORIES));
      var mids = sel[0] !== '전체' ? CATEGORIES[sel[0]] : null;
      buttonRow('row1', 1, mids && Object.keys(mids).length ? Object.keys(mids) : null);
      var subs = mids && sel[1] !== '전체' ? mids[sel[1]] : null;
      buttonRow('row2', 2, subs && subs.length ? subs : null);

      // 마커 + 목록
      infoWindow.close();
      var list = document.getElementById('list');
      list.innerHTML = '';
      var shown = [];

      PLACES.forEach(function (p) {
        var ok = matchCategory(p) && matchSearch(p);
        if (p.marker) p.marker.setMap(ok ? map : null);
        if (ok) shown.push(p);
      });

      // 현재 필터·검색에 맞는 가게 목록
      {
        shown.forEach(function (p) {
          var li = document.createElement('li');
          li.innerHTML = '<div class="name">' + p.name + '</div>' +
            '<div class="meta">' + catLabel(p) + ' · ' + fullAddr(p) +
            (p.marker ? '' : ' <span class="nopos">(위치 못 찾음)</span>') + '</div>';
          li.onclick = function () {
            if (!p.marker) return;
            map.setZoom(17);
            map.panTo(p.marker.getPosition());
            openInfo(p);
            // 휴대폰처럼 화면이 좁으면 지도가 보이도록 목록을 접음
            if (window.innerWidth < 600) {
              document.getElementById('panel').classList.add('collapsed');
              document.getElementById('toggle').textContent = '목록 펼치기 ▼';
            }
          };
          list.appendChild(li);
        });
      }

      var msg = shown.length + '곳 표시 중';
      if (query && shown.length === 0) msg = '검색 결과가 없어요';
      document.getElementById('count').textContent = msg + failedMsg;
    }

    var failedMsg = '';

    // 목록 접기/펼치기
    document.getElementById('toggle').addEventListener('click', function () {
      var panel = document.getElementById('panel');
      panel.classList.toggle('collapsed');
      this.textContent = panel.classList.contains('collapsed') ? '목록 펼치기 ▼' : '목록 접기 ▲';
    });
    document.getElementById('search').addEventListener('input', function (e) {
      query = e.target.value.trim().toLowerCase();
      render();
    });

    // ===== 5. 시작 =====
    Promise.all(PLACES.map(geocode)).then(function () {
      var failed = [];
      var used = {};
      PLACES.forEach(function (p) {
        if (!p.lat) return;
        // 같은 건물(같은 좌표)에 있는 가게는 마커가 겹치지 않게 살짝 옆으로 옮김
        var key = p.lat.toFixed(6) + ',' + p.lng.toFixed(6);
        var n = used[key] || 0;
        used[key] = n + 1;
        p.lng += n * 0.00012;
      });
      PLACES.forEach(function (p) {
        if (!p.lat) { failed.push(p.name); return; }
        p.marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(p.lat, p.lng),
          map: map,
          title: p.name
        });
        naver.maps.Event.addListener(p.marker, 'click', function () { openInfo(p); });
      });
      if (failed.length) {
        failedMsg = failed.length === PLACES.length
          ? ' · 위치를 하나도 못 찾았어요 (Geocoding 설정 확인)'
          : ' · 위치 못 찾음 ' + failed.length + '곳';
        console.warn('주소로 위치를 못 찾은 가게:', failed);
      }
      render();
    });
  </script>
</body>
</html>
